plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework:spring-web'
	implementation 'org.springframework.modulith:spring-modulith-api:2.2.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.modulith:spring-modulith-core:2.2.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootRun') {
	if (providers.gradleProperty('jfr').isPresent()) {
		def recordingFile = layout.buildDirectory.file('batch.jfr').get().asFile
		jvmArgs("-XX:StartFlightRecording=name=batch,settings=profile,maxsize=128m,dumponexit=true,filename=" + recordingFile)
	}
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'batch.test.classpath', sourceSets.test.runtimeClasspath.asPath
}
