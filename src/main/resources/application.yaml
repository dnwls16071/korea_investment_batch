spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: korea_investment_batch
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never

management:
  endpoints:
    jmx:
      exposure:
        include: metrics
