spring:
  application:
    name: korea_investment_batch
  datasource:
    url: ${BATCH_DB_URL:jdbc:mysql://localhost:3306/korea_investment_batch?connectionTimeZone=UTC}
    username: ${BATCH_DB_USER:batch}
    password: ${BATCH_DB_PASSWORD:}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

collection:
  zone: Asia/Seoul
  enabled: ${COLLECTION_ENABLED:false}
  cron: "${COLLECTION_CRON:0 30 19 * * *}"
  kis:
    archive-root: ${KIS_ARCHIVE_ROOT:./data/kis}
    minimum-retained-ratio: ${KIS_MINIMUM_RETAINED_RATIO:0.9}
    chunk-size: ${KIS_CHUNK_SIZE:500}
    timeout: ${KIS_TIMEOUT:30s}
    urls:
      KOSPI: ${KIS_KOSPI_URL:https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip}
      KOSDAQ: ${KIS_KOSDAQ_URL:https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip}
      NASDAQ: ${KIS_NASDAQ_URL:https://new.real.download.dws.co.kr/common/master/nasmst.cod.zip}
      NYSE: ${KIS_NYSE_URL:https://new.real.download.dws.co.kr/common/master/nysmst.cod.zip}
      AMEX: ${KIS_AMEX_URL:https://new.real.download.dws.co.kr/common/master/amsmst.cod.zip}
  dart:
    endpoint: ${DART_ENDPOINT:https://opendart.fss.or.kr/api/list.json}
    api-key: ${DART_API_KEY:}
    page-size: ${DART_PAGE_SIZE:100}
    sort: date
    sort-direction: desc
    timeout: ${DART_TIMEOUT:10s}
    retries: ${DART_RETRIES:2}
    retry-delay: ${DART_RETRY_DELAY:1s}
    lookback-days: ${DART_LOOKBACK_DAYS:2}
